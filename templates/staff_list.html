{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <h2>Staff</h2>
  <a class="button" href="{{ url_for('staff_new') }}">Add staff</a>
</div>
<table class="table">
  <thead>
    <tr>
      <th>Name</th>
      <th>Role</th>
      <th>Email</th>
      <th>Phone</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    {% for member in staff %}
    <tr>
      <td>{{ member.first_name }} {{ member.last_name }}</td>
      <td>{{ member.role or "-" }}</td>
      <td>{{ member.email or "-" }}</td>
      <td>{{ member.phone or "-" }}</td>
      <td class="table-actions">
        <a class="link" href="{{ url_for('staff_edit', staff_id=member.id) }}">Edit</a>
        <form method="post" action="{{ url_for('staff_delete', staff_id=member.id) }}">
          <button class="link danger" type="submit">Delete</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr>
      <td colspan="5" class="empty">No staff added yet.</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
