<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Medzone Agency Manager | Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <main class="container" style="max-width: 520px;">
      <section class="hero" style="margin-top: 3rem;">
        <div>
          <h1>Sign in</h1>
          <p>Use your Medzone account to access the agency dashboard.</p>
        </div>
      </section>
      <form method="post" class="form" style="margin-top: 1.5rem;">
        {% if error %}
          <div class="alert">{{ error }}</div>
        {% endif %}
        <div class="form-grid">
          <label>
            Username
            <input name="username" required />
          </label>
          <label>
            Password
            <input name="password" type="password" required />
          </label>
        </div>
        <button class="button" type="submit">Login</button>
      </form>
    </main>
  </body>
</html>
