{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <h2>Reports</h2>
</div>
<section class="cards">
  <div class="card">
    <div class="card-title">Total students</div>
    <div class="card-value">{{ totals }}</div>
  </div>
  <div class="card">
    <div class="card-title">Fees due</div>
    <div class="card-value">{{ fees_due_total }}</div>
  </div>
  <div class="card">
    <div class="card-title">Fees collected</div>
    <div class="card-value">{{ payments_total }}</div>
  </div>
  <div class="card">
    <div class="card-title">Outstanding balance</div>
    <div class="card-value">{{ balance_total }}</div>
  </div>
</section>
{% endblock %}
