{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <h2>Courses</h2>
  <a class="button" href="{{ url_for('courses_new') }}">Add course</a>
</div>
<table class="table">
  <thead>
    <tr>
      <th>Name</th>
      <th>Code</th>
      <th>Duration (months)</th>
      <th>Fee</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    {% for course in courses %}
    <tr>
      <td>{{ course.name }}</td>
      <td>{{ course.code or "-" }}</td>
      <td>{{ course.duration_months or "-" }}</td>
      <td>{{ course.fee or "-" }}</td>
      <td class="table-actions">
        <a class="link" href="{{ url_for('courses_edit', course_id=course.id) }}">Edit</a>
        <form method="post" action="{{ url_for('courses_delete', course_id=course.id) }}">
          <button class="link danger" type="submit">Delete</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr>
      <td colspan="5" class="empty">No courses added yet.</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
