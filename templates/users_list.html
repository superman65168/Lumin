{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <h2>Users</h2>
</div>
<form class="form" method="post" action="{{ url_for('users_list') }}">
  <div class="form-grid">
    <label>
      Username
      <input name="username" required />
    </label>
    <label>
      Password
      <input name="password" type="password" required />
    </label>
    <label>
      Role
      <select name="role">
        <option value="admin">Admin</option>
        <option value="staff" selected>Staff</option>
      </select>
    </label>
  </div>
  <button class="button" type="submit">Create user</button>
</form>

<table class="table" style="margin-top: 1.5rem;">
  <thead>
    <tr>
      <th>Username</th>
      <th>Role</th>
      <th>Created</th>
    </tr>
  </thead>
  <tbody>
    {% for user in users %}
    <tr>
      <td>{{ user.username }}</td>
      <td>{{ user.role }}</td>
      <td>{{ user.created_at }}</td>
    </tr>
    {% else %}
    <tr>
      <td colspan="3" class="empty">No users found.</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
