{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <h2>{{ "Edit course" if course else "Add course" }}</h2>
  <a class="button secondary" href="{{ url_for('courses_list') }}">Back</a>
</div>
{% if error %}
  <div class="alert">{{ error }}</div>
{% endif %}
<form method="post" class="form">
  <div class="form-grid">
    <label>
      Name
      <input name="name" value="{{ course.name if course else '' }}" required />
    </label>
    <label>
      Code
      <input name="code" value="{{ course.code if course else '' }}" />
    </label>
    <label>
      Duration (months)
      <input name="duration_months" type="number" min="1" value="{{ course.duration_months if course else '' }}" />
    </label>
    <label>
      Fee
      <input name="fee" type="number" step="0.01" min="0" value="{{ course.fee if course else '' }}" />
    </label>
  </div>
  <button class="button" type="submit">Save</button>
</form>
{% endblock %}
